<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      fetch("http://127.0.0.1:3000/getallcourses")
        .then((data) => {
          return data.json();
        })
        .then((datajson) => {
          console.log(datajson);
          let newDiv = document.createElement("div");
          newDiv.innerHTML = `${datajson.course_name}`;
          document.body.appendChild(newDiv);
        });
    </script>
  </body>
</html>
