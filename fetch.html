      .then((data) => {
        return data.json();
      })
      .then((datajson) => {
        console.log(datajson);

        datajson.forEach((employee) => {

          document.body.appendChild(newDiv);
          newDiv.innerHTML=`<p> employee</p>`
        });

      .catch((err) => {
        console.log(err);
      });
